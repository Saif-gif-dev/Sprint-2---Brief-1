    <header>
        <nav>
            <img class="hlogo" src="\assets\image.png" alt="HelpDesk Logo">
            <button class="hamburger">
                ☰
            </button>
            <p class="headercop">Atlas Solutions / Support</p>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="firsttwo">
                <div class="heading">
                    <h1>Gestion des demandes</h1>
                </div>
                <div class="description">
                    <p>Suivez et gérez les incidents informatiques.</p>
                </div>
            </div>

        </section>
        <section class="formulaire">
            <div class="lastwo">
                <div class="headingtwo">
                    <h1>Créer une demande</h1>
                </div>
                <div class="soushead">
                    <p>Décrivez votre problème informatique.</p>
                </div>
            </div>
            <form class="formcontainer" id="problemform">

                <div>
                    <label for="titreprob">Titre du problème *</label><br>
                    <input type="text" id="titreInput" placeholder="Connexion Wi-Fi instable">
                </div>

                <div>
                    <label for="category">Catégorie *:</label><br>
                    <select class="my-select" id="categoryProblem">
                        <option value="Réseau">Réseau</option>
                        <option value="Logiciel">Logiciel</option>
                        <option value="Matériel">Matériel</option>
                    </select><br>
                </div>

                <div>
                    <label for="priority">Priorité *:</label><br>
                    <select class="my-select" name="priority" id="priorityProblem">
                        <option value="Basse">Basse</option>
                        <option value="Normale">Normale</option>
                        <option value="Haute">Haute</option>
                    </select>
                </div>
                <div class="descriptionInput">
                    <label for="desc">Description *</label><br>
                    <input type="text" id="descproblem" placeholder="Décrivez votre problème...">
                </div>
            </form>

            <div class="btn-blue">
                <button class="bluebutton" id="buttonAjouter" type="button">
                    ＋ Ajouter la demande </button>
            </div>
        </section>
        <section class="listedemande">
            <div class="listhead">
                <h1>Liste des demandes</h1>
            </div>
            <div class="nbredemande">
                <span id="complaintCounter">3 demandes</span>
            </div>
            </div>

        </section>
